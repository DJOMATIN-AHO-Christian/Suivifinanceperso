<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0)"/>
      <stop offset="100%" stop-color="rgba(52, 211, 153, 0.25)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#34d399" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Fond d'icône arrondi -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Lueur de fond -->
  <circle cx="256" cy="220" r="160" fill="radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%)" />
  
  <!-- Bouclier & Graphique Patrimonial -->
  <g filter="url(#shadow)">
    <!-- Forme du bouclier (Résilience) -->
    <path d="M256 96 L376 148 C376 250 326 332 256 376 C186 332 136 250 136 148 Z" 
          fill="rgba(13, 20, 36, 0.75)" 
          stroke="url(#primaryGrad)" 
          stroke-width="8" 
          stroke-linejoin="round"/>
          
    <!-- Barres de croissance financière montantes -->
    <rect x="186" y="254" width="22" height="64" rx="6" fill="#38bdf8" opacity="0.85"/>
    <rect x="222" y="214" width="22" height="104" rx="6" fill="#22d3ee" opacity="0.9"/>
    <rect x="258" y="184" width="22" height="134" rx="6" fill="#34d399"/>
    <rect x="294" y="154" width="22" height="164" rx="6" fill="#a78bfa"/>
    
    <!-- Ligne de tendance ascendante (Indépendance & Croissance) -->
    <path d="M176 270 L233 226 L269 196 L315 140" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Flèche sommmitale -->
    <circle cx="315" cy="140" r="7" fill="#ffffff"/>
  </g>
  
  <!-- Symbole de monnaie au bas du bouclier -->
  <circle cx="256" cy="420" r="16" fill="url(#primaryGrad)"/>
  <circle cx="216" cy="420" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="296" cy="420" r="4" fill="rgba(255,255,255,0.2)"/>
</svg>
